<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brew Coffee Shop Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background-color: var(--accent-color);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="2" x2="6" y2="4"></line>
                    <line x1="10" y1="2" x2="10" y2="4"></line>
                    <line x1="14" y1="2" x2="14" y2="4"></line>
                </svg>
            </div>
            <h1>brew Coffee Shop</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="theme-toggle-btn" style="background: none; border: none; cursor: pointer; color: white; font-size: 1.25rem; padding: 0.25rem;">
                🌙
            </button>
            <button id="auth-btn" style="display: none; background: white; color: var(--accent-color); border-color: white;">Sign In with Google</button>
        </div>
    </header>

    <main id="signed-out-view">
        <div class="welcome">
            <h2>Welcome to brew Coffee Shop!</h2>
            <p>Sign in to chat with our AI assistant about our menu, hours, and more.</p>
        </div>
    </main>

    <main id="signed-in-view" style="display: none;">
        <aside id="sidebar" style="width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto;">
            <div style="display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-color);">
                <button id="tab-menu" style="flex: 1; padding: 0.75rem; border: none; background: var(--accent-color); color: white; cursor: pointer; border-radius: 0;">Menu</button>
                <button id="tab-history" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-color); cursor: pointer; border-radius: 0;">History</button>
            </div>
            
            <div id="loyalty-tracker" style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); background-color: var(--card-bg);">
                <h3 style="margin: 0 0 0.5rem 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Loyalty Status</h3>
                <div style="background-color: var(--loyalty-bg); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem;">
                    <div id="loyalty-bar" style="width: 0%; height: 100%; background-color: var(--accent-color); transition: width 0.3s ease;"></div>
                </div>
                <p id="loyalty-text" style="margin: 0; font-size: 0.75rem; color: var(--text-color);">0/9 Drinks for a free reward</p>
            </div>
            
            <div id="menu-view" style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column; gap: 2rem;">
                <div>
                    <h3 style="margin: 0 0 1rem 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Menu</h3>
                    <ul id="menu-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem;">
                    </ul>
                </div>
                
                <div style="margin-top: auto;">
                    <h3 style="margin: 0 0 1rem 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Cart</h3>
                    <ul id="cart-list" style="list-style: none; padding: 0; margin: 0 0 1rem 0; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
                    </ul>
                    <div style="display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 1rem;">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button id="place-order-btn" disabled style="width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 0.75rem; border-radius: 4px; cursor: pointer;">Place Order</button>
                </div>
            </div>

            <div id="history-view" style="display: none; padding: 1.5rem; flex: 1; flex-direction: column; gap: 1rem;">
                <h3 style="margin: 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Past Orders</h3>
                <ul id="history-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1rem;">
                </ul>
            </div>
        </aside>

        <section id="chat-section" style="flex: 1; display: flex; flex-direction: column; background-color: var(--card-bg); overflow: hidden;">
            <div id="chat-container">
            </div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Ask about our coffee..." required autocomplete="off">
                <button type="button" id="mic-btn" style="background-color: var(--input-bg); color: var(--accent-color); border: 1px solid var(--border-color); margin-right: 0.5rem; display: none;">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>
                <button type="submit">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
            <div class="p-4 text-[10px] text-[#9CA3AF] border-t border-[#E5E5DE] uppercase tracking-tighter" style="text-align: center; padding: 1rem; border-top: 1px solid var(--border-color); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
                Connected to Gemini 3.8 Flash
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/app.js"></script>
</body>
</html>
